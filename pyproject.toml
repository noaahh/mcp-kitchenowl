[project]
name = "kitchenowl-mcp"
version = "0.1.0"
description = "MCP server for KitchenOwl — manage shopping lists, recipes, meal plans, and expenses from any MCP client"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Lukas Hennig" }]
keywords = ["kitchenowl", "mcp", "model-context-protocol", "fastmcp"]
dependencies = [
    "fastmcp>=3,<4",
    "httpx>=0.27",
]

[project.scripts]
kitchenowl-mcp = "kitchenowl_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitchenowl_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
